name: ingest

# The ingest is a standalone cron script, deliberately not a Next.js route
# handler (SPEC §8). Running it here rather than on Vercel keeps the service
# role key — which bypasses row level security — out of the environment that
# serves the public site.

on:
  schedule:
    # Asks for every ten minutes. It does not get it, and the comment that used
    # to sit here — that a delay "at this interval is fine" — was wrong. Measured
    # over 110 scheduled runs across 3.6 days: the median gap is 38 minutes, p90
    # is 64, p95 is 95, and the worst was 569 — nine and a half hours. GitHub
    # drops scheduled runs it cannot place, and does not make them up.
    #
    # The offset minutes are the only lever available from here. '*/10' fires on
    # :00, :10, :20 and so on, which are the minutes every other repository also
    # asks for, and the ones a loaded queue sheds first. This asks for the gaps
    # between them instead. Whether it helps takes days of runs to tell; if the
    # numbers above have not moved after a week, this was not the problem.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Run a single adapter only (e.g. yeniduzen). Blank runs all five.'
        required: false
        type: string
      dry_run:
        description: 'Parse and report without writing to the database'
        required: false
        type: boolean
        default: false

# One run at a time. The upserts are idempotent, so an overlap would not corrupt
# anything, but queueing keeps the logs readable and the sources politely used.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Well above a normal run, low enough that a hung fetch cannot idle for long.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_CONTACT: ${{ secrets.INGEST_CONTACT }}
          # Required: the parser reads every announcement with a model (§10.4).
          # Without it the run stores nothing and everything goes to review.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Dispatch inputs travel through the environment instead of being
          # interpolated into the shell command, so a crafted input cannot
          # become part of it. On a scheduled run they are simply empty.
          ADAPTER: ${{ inputs.adapter }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$ADAPTER" ]; then ARGS="$ARGS $ADAPTER"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "running: npm run ingest --$ARGS"
          npm run ingest -- $ARGS
