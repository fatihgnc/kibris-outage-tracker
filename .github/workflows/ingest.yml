name: ingest

# The ingest is a standalone cron script, deliberately not a Next.js route
# handler (SPEC §8). Running it here rather than on Vercel keeps the service
# role key — which bypasses row level security — out of the environment that
# serves the public site.

on:
  # A backstop, not the trigger.
  #
  # GitHub reads `schedule` as a request it may drop, and drops most of these.
  # Measured over 110 scheduled runs across 3.6 days: median gap 38 minutes, p90
  # 64, p95 95, worst 569 — nine and a half hours. The offset minute below was
  # the one lever available from here: away from :00, the minute every other
  # repository asks for and the first a loaded queue sheds.
  #
  # So the ingest is triggered from outside instead: a pinger calls the
  # workflow_dispatch below on the interval the site actually wants (hourly,
  # 2026-09-11 — every ten minutes was driving Supabase egress past the free
  # tier's 5GB/month by re-invalidating every static page on every run), which
  # GitHub does honour because an API call is not a favour it can decline. This
  # line stays because a backstop that runs late is worth more than no backstop
  # at all — if the pinger dies, the ingest still runs, and the stale banner
  # covers the gap.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Run a single adapter only (e.g. yeniduzen). Blank runs all five.'
        required: false
        type: string
      dry_run:
        description: 'Parse and report without writing to the database'
        required: false
        type: boolean
        default: false

# One run at a time. The upserts are idempotent, so an overlap would not corrupt
# anything, but queueing keeps the logs readable and the sources politely used.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Well above a normal run, low enough that a hung fetch cannot idle for long.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_CONTACT: ${{ secrets.INGEST_CONTACT }}
          # Required: the parser reads every announcement with a model (§10.4).
          # Without it the run stores nothing and everything goes to review.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Optional. Together these tell IndexNow which pages a run changed, so
          # Bing does not wait to rediscover a notice that is only useful today.
          # With either one unset the ingest simply does not ping (§indexnow.ts),
          # and the run is unaffected either way.
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Optional. With the site URL above, drops the site's cached pages
          # after a run so the next reader is not served last night's page
          # (app/api/revalidate). Must equal the same variable on Vercel;
          # unset, the ingest skips the call and the run is unaffected.
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Dispatch inputs travel through the environment instead of being
          # interpolated into the shell command, so a crafted input cannot
          # become part of it. On a scheduled run they are simply empty.
          ADAPTER: ${{ inputs.adapter }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$ADAPTER" ]; then ARGS="$ARGS $ADAPTER"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "running: npm run ingest --$ARGS"
          npm run ingest -- $ARGS
