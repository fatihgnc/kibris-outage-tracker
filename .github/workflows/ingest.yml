name: ingest

# The ingest is a standalone cron script, deliberately not a Next.js route
# handler (SPEC §8). Running it here rather than on Vercel keeps the service
# role key — which bypasses row level security — out of the environment that
# serves the public site.

on:
  # A backstop, not the trigger.
  #
  # GitHub reads `schedule` as a request it may drop, and drops most of these.
  # Measured over 110 scheduled runs across 3.6 days: median gap 38 minutes, p90
  # 64, p95 95, worst 569 — nine and a half hours. The offset minutes below were
  # the one lever available from here: '*/10' fires on :00, :10, :20, the minutes
  # every other repository asks for and the first a loaded queue sheds, so this
  # asks for the gaps between them. It did not move the numbers. A later 28-hour
  # window got 6 of the ~168 runs it asked for, with gaps of 50, 101, 123, 210
  # and 569 minutes — and the site sat on the stale banner for nine hours while
  # every adapter, the parser and the database were working perfectly.
  #
  # So the ingest is triggered from outside instead: a pinger calls the
  # workflow_dispatch below every ten minutes, which GitHub does honour because
  # an API call is not a favour it can decline. This line stays because a
  # backstop that runs late is worth more than no backstop at all — if the
  # pinger dies, the ingest still runs, and the stale banner covers the gap.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Run a single adapter only (e.g. yeniduzen). Blank runs all five.'
        required: false
        type: string
      dry_run:
        description: 'Parse and report without writing to the database'
        required: false
        type: boolean
        default: false

# One run at a time. The upserts are idempotent, so an overlap would not corrupt
# anything, but queueing keeps the logs readable and the sources politely used.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Well above a normal run, low enough that a hung fetch cannot idle for long.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_CONTACT: ${{ secrets.INGEST_CONTACT }}
          # Required: the parser reads every announcement with a model (§10.4).
          # Without it the run stores nothing and everything goes to review.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Dispatch inputs travel through the environment instead of being
          # interpolated into the shell command, so a crafted input cannot
          # become part of it. On a scheduled run they are simply empty.
          ADAPTER: ${{ inputs.adapter }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$ADAPTER" ]; then ARGS="$ARGS $ADAPTER"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "running: npm run ingest --$ARGS"
          npm run ingest -- $ARGS
